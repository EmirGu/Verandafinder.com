<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrijfsprofiel — Verandawijzer.nl</title>
  <meta name="description" content="Bekijk het profiel, de specificaties en het werkgebied van dit verandabedrijf. Vergelijk met andere bedrijven en vraag gratis een offerte aan.">
  <meta property="og:title" content="Bedrijfsprofiel — Verandawijzer.nl">
  <meta property="og:description" content="Profielen en specificaties van verandabedrijven, op basis van hun eigen websites, onafhankelijk op een rij gezet door Verandawijzer.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232c5e46'/%3E%3Cpath d='M4 11.5 12 5l8 6.5M6.5 10v9M17.5 10v9M4.5 19h15M10 19v-4h4v4' stroke='%23f0b45c' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    /* Pagina-specifiek: kleine aanvullingen op het design system */
    .detail-hero .bedrijf-plaats { color: #c9d9cf; font-size: .95rem; margin-top: 2px; }
    .detail-hero .review-aantal { color: #c9d9cf; }
    .detail-hero .geen-reviews { color: #c9d9cf; font-size: .92rem; }
    .keurmerk-rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .detail-blok > h2 { font-size: 1.35rem; margin-bottom: 14px; }
    .detail-zijbalk h2 { font-size: 1.05rem; }
    .prijs-regel { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 14px 0; }
    .prijs-regel .prijs-bedrag { font-family: var(--font-kop); font-weight: 700; font-size: 1.55rem; color: var(--groen-900); }
    .prijs-regel .prijs-eenheid { font-size: .9rem; color: var(--ink-500); font-weight: 500; }
    .review-overzicht {
      display: grid; grid-template-columns: auto 1fr; gap: 14px 44px; align-items: center;
      padding-bottom: 22px; margin-bottom: 6px; border-bottom: 1px solid var(--lijn);
    }
    .review-gem-cijfer { font-family: var(--font-kop); font-weight: 700; font-size: 2.9rem; color: var(--groen-900); line-height: 1.05; }
    .raster-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
    .zijbalk-acties { display: grid; gap: 10px; }
    .knop.actief.knop-outline { background: var(--groen-700); color: #fff; }
    .knop.actief.knop-wit { border-color: var(--rood-600); color: var(--rood-600); }
    @media (max-width: 760px) {
      .review-overzicht, .raster-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#inhoud">Direct naar inhoud</a>
  <div id="site-header"></div>

  <main id="inhoud">
    <div id="profiel"></div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
      const maandJaar = (datum) => {
        const [jaar, maand] = datum.split("-");
        return MAANDEN[parseInt(maand, 10) - 1] + " " + jaar;
      };
      const komma = (n) => n.toFixed(1).replace(".", ",");
      const vinkjeSVG = '<svg class="vinkje" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
      const keurmerkSVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
      const sterSVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="color:var(--amber-500)" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>';
      const plusSVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      const hartSVG = (gevuld) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${gevuld ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;
      const externSVG = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>';

      const houder = document.getElementById("profiel");
      const id = new URLSearchParams(location.search).get("id");
      const b = id ? VF.getBedrijf(id) : null;

      /* --- Onbekend of ontbrekend id: nette foutmelding --- */
      if (!b) {
        document.title = "Bedrijf niet gevonden — Verandawijzer.nl";
        houder.innerHTML = `
          <section class="pagina-kop">
            <div class="wrap">
              <nav class="breadcrumb" aria-label="Kruimelpad"><a href="index.html">Home</a> › <a href="bedrijven.html">Bedrijven</a> › <span>Niet gevonden</span></nav>
              <h1>Bedrijf niet gevonden</h1>
            </div>
          </section>
          <section class="sectie">
            <div class="wrap-smal">
              <div class="kaart leeg-melding">
                <div class="leeg-icoon" aria-hidden="true">
                  <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--ink-300)" stroke-width="1.6" stroke-linecap="round" style="margin:0 auto"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8.5 11h5"/></svg>
                </div>
                <h2>Dit bedrijfsprofiel bestaat niet (meer)</h2>
                <p>De link die je volgde klopt niet, of het bedrijf is niet langer opgenomen in de gids van Verandawijzer. Geen zorgen: er zijn genoeg andere verandabouwers om te vergelijken.</p>
                <a class="knop knop-primair" href="bedrijven.html">Bekijk alle bedrijven</a>
              </div>
            </div>
          </section>`;
        return;
      }

      /* --- Bedrijf gevonden: titel en profiel opbouwen --- */
      document.title = b.naam + " — Verandawijzer.nl";

      /* Vestiging, null-veilig: landelijke aanbieders zonder vermelde vestiging */
      const plaatsTekst = [b.plaats, b.provincie].filter(Boolean).join(", ") || "Landelijk actief";

      /* Merken (en eventuele geverifieerde keurmerken) als badges in de hero */
      const heroBadges = [
        ...(b.merken || []).map((m) => `<span class="badge">${m}</span>`),
        ...(b.keurmerken || []).map((k) => `<span class="badge badge-keurmerk">${keurmerkSVG}${k}</span>`)
      ];

      /* --- Specificaties: alleen rijen waarvoor echte data bestaat --- */
      const werkgebiedTekst = b.werkgebied
        ? (b.werkgebied.includes("Landelijk") ? "Heel Nederland" : b.werkgebied.join(", "))
        : null;
      const specRijen = [
        ["Producten", b.producten.length ? b.producten.map((p) => PRODUCTEN[p]).join(", ") : null],
        ["Materialen", b.typen.length ? b.typen.map((t) => MATERIALEN[t]).join(", ") : null],
        ["Daktypen", b.dakTypen.length ? b.dakTypen.map((d) => DAKTYPEN[d]).join(", ") : null],
        ["Opties", b.opties.length ? b.opties.map((o) => OPTIES[o]).join(", ") : null],
        ["Merken", b.merken.length ? b.merken.join(", ") : null],
        ["Werkgebied", werkgebiedTekst],
        ["Adres", b.adres],
        ["Opgericht", b.opgericht],
        ["Showroom", b.showroom === true ? "Ja" : null],
        ["Eigen montageteam", b.montageEigenTeam === true ? "Ja" : null],
        ["Zelfbouwpakket mogelijk", b.zelfbouwMogelijk === true ? "Ja" : null]
      ].filter(([, waarde]) => waarde);
      const specsHTML = specRijen.map(([label, waarde]) => `<tr><th scope="row">${label}</th><td>${waarde}</td></tr>`).join("");

      /* --- Prijsindicatie: marktrichtprijs uit de prijswijzer, geen bedrijfsprijs --- */
      const RICHT_LABELS = { aluminium: "een aluminium veranda", hout: "een houten veranda", staal: "een stalen veranda", kunststof: "een kunststof veranda" };
      const richtMateriaal = b.typen[0] || null;
      const richt = (richtMateriaal && RICHTPRIJZEN_M2[richtMateriaal]) || RICHTPRIJZEN_M2.standaard;
      const richtLabel = richtMateriaal ? RICHT_LABELS[richtMateriaal] : "een veranda (alle materialen)";

      /* --- Reviews: echte reviews tonen zodra ze er zijn, anders een eerlijke lege staat --- */
      const reviewMail = `mailto:reviews@verandawijzer.nl?subject=${encodeURIComponent("Review: " + b.naam)}`;
      const deelKnop = `<a class="knop knop-outline" href="${reviewMail}">Deel jouw ervaring</a>`;
      let reviewsBlokHTML;
      if (b.reviews.length) {
        const reviews = [...b.reviews].sort((a, c) => c.datum.localeCompare(a.datum));
        const gemiddelde = b.rating || reviews.reduce((som, r) => som + r.score, 0) / reviews.length;
        const aantal = b.aantalReviews || reviews.length;
        const verdeling = [5, 4, 3, 2, 1].map((s) => ({ ster: s, aantal: reviews.filter((r) => r.score === s).length }));
        const verdelingLabel = "Scoreverdeling: " + verdeling.map((v) => `${v.ster} sterren: ${v.aantal} ${v.aantal === 1 ? "review" : "reviews"}`).join(", ");
        const verdelingHTML = verdeling.map((v) => {
          const pct = Math.round((v.aantal / reviews.length) * 100);
          return `<div class="verdeling-rij">
            <span style="display:flex;align-items:center;gap:4px;justify-content:flex-end">${v.ster} ${sterSVG}</span>
            <div class="verdeling-balk"><span style="width:${pct}%"></span></div>
            <span>${v.aantal}</span>
          </div>`;
        }).join("");
        const reviewsHTML = reviews.map((r) => `
          <article class="review-kaart">
            <div class="review-kop">
              <div><span class="review-naam">${r.naam}</span> <span class="review-meta">${[r.plaats, maandJaar(r.datum)].filter(Boolean).join(" · ")}</span></div>
              ${VF.sterrenHTML(r.score)}
            </div>
            ${r.titel ? `<h3 style="font-size:1rem;margin:0">${r.titel}</h3>` : ""}
            <p>${r.tekst}</p>
            ${r.project ? `<p class="review-project">Project: ${r.project}</p>` : ""}
          </article>`).join("");
        reviewsBlokHTML = `
          <div class="review-overzicht">
            <div>
              <div class="review-gem-cijfer">${komma(gemiddelde)}</div>
              ${VF.sterrenHTML(gemiddelde)}
              <p class="klein mb-0 mt-1">op basis van ${aantal} ${aantal === 1 ? "beoordeling" : "beoordelingen"}</p>
            </div>
            <div role="img" aria-label="${verdelingLabel}">
              ${verdelingHTML}
            </div>
          </div>
          ${reviewsHTML}
          <p class="mb-0 mt-2">${deelKnop}</p>`;
      } else {
        reviewsBlokHTML = `
          <p>Er zijn nog geen reviews van ${b.naam} via Verandawijzer.</p>
          <p class="klein">Ons reviewsysteem is net gestart: we verzamelen ervaringen van klanten en tonen die hier zodra ze binnenkomen en gecontroleerd zijn. Heb jij een veranda of overkapping laten leveren door dit bedrijf? Met jouw ervaring help je anderen kiezen.</p>
          ${deelKnop}`;
      }

      /* --- Vergelijkbare bedrijven: zelfde provincie of overlappend werkgebied (null-veilig) --- */
      const eigenWerkgebied = b.werkgebied || [];
      const vergelijkbaar = BEDRIJVEN
        .filter((x) => x.id !== b.id)
        .map((x) => {
          const xWerkgebied = x.werkgebied || [];
          let score = 0;
          if (b.provincie && x.provincie === b.provincie) score += 4;
          if (b.provincie && (xWerkgebied.includes(b.provincie) || xWerkgebied.includes("Landelijk"))) score += 2;
          if (x.provincie && (eigenWerkgebied.includes(x.provincie) || eigenWerkgebied.includes("Landelijk"))) score += 2;
          if (eigenWerkgebied.includes("Landelijk") && xWerkgebied.includes("Landelijk")) score += 1;
          return { bedrijf: x, score };
        })
        .filter((x) => x.score > 0)
        .sort((a, c) => c.score - a.score)
        .slice(0, 2)
        .map((x) => x.bedrijf);

      houder.innerHTML = `
        <section class="detail-hero">
          <div class="wrap">
            <nav class="breadcrumb" aria-label="Kruimelpad"><a href="index.html">Home</a> › <a href="bedrijven.html">Bedrijven</a> › <span>${b.naam}</span></nav>
            <div class="detail-kop-raster">
              ${VF.avatarHTML(b, "detail-logo")}
              <div>
                <h1>${b.naam}</h1>
                <p class="bedrijf-plaats"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>${plaatsTekst}</p>
                <div class="mt-1">${VF.scoreHTML(b)}</div>
                ${heroBadges.length ? `<div class="keurmerk-rij">${heroBadges.join("")}</div>` : ""}
              </div>
            </div>
          </div>
        </section>

        <div class="detail-body">
          <div class="wrap">
            <div class="detail-raster">
              <div class="detail-hoofdkolom">

                <section class="kaart detail-blok" aria-labelledby="kop-over">
                  <h2 id="kop-over">Over ${b.naam}</h2>
                  <p>${b.profiel}</p>
                  ${b.kenmerken.length ? `<ul class="icoon-lijst mt-2">
                    ${b.kenmerken.map((k) => `<li>${vinkjeSVG}${k}</li>`).join("")}
                  </ul>` : ""}
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-specs">
                  <h2 id="kop-specs">Specificaties</h2>
                  <table class="specs-tabel">
                    <tbody>
                      ${specsHTML}
                    </tbody>
                  </table>
                  <p class="klein mb-0 mt-2">We tonen alleen gegevens die het bedrijf zelf publiceert; ontbrekende onderdelen laten we weg.</p>
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-prijs">
                  <h2 id="kop-prijs">Prijsindicatie</h2>
                  <p>${b.naam} publiceert geen prijzen per m² op de eigen website, dus tonen we hier geen bedrijfsspecifieke prijs. Ter oriëntatie zie je de marktrichtprijs voor ${richtLabel} — een gemiddelde bandbreedte voor de Nederlandse markt, niet specifiek van dit bedrijf.</p>
                  <div class="prijs-regel">
                    <span class="prijs-bedrag">${VF.euro(richt.min)} – ${VF.euro(richt.max)}</span>
                    <span class="prijs-eenheid">per m², incl. montage en btw</span>
                    <span class="badge badge-uit">Marktrichtprijs, niet van dit bedrijf</span>
                  </div>
                  <p>Wat je werkelijk betaalt hangt af van afmeting, materiaal, daktype en opties. Vraag daarom een offerte aan voor een echte prijs op maat.</p>
                  <p class="mb-0"><a href="prijzen.html">Bekijk de marktrichtprijzen in de prijswijzer →</a></p>
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-reviews">
                  <h2 id="kop-reviews">Reviews</h2>
                  ${reviewsBlokHTML}
                </section>

                ${vergelijkbaar.length ? `<section class="kaart detail-blok" aria-labelledby="kop-vergelijkbaar">
                  <h2 id="kop-vergelijkbaar">Vergelijkbare bedrijven</h2>
                  <p class="klein">Actief in dezelfde regio, of landelijk werkend.</p>
                  <div class="raster-2">
                    ${vergelijkbaar.map((x) => VF.bedrijfKaartHTML(x)).join("")}
                  </div>
                </section>` : ""}

              </div>

              <aside class="detail-zijbalk" aria-label="Acties voor dit bedrijf">
                <div class="kaart detail-blok">
                  <h2>Direct regelen</h2>
                  <div class="zijbalk-acties">
                    ${b.website ? `<a class="knop knop-primair knop-breed" href="${b.website}" target="_blank" rel="noopener">Bezoek website ${externSVG}</a>` : ""}
                    <a class="knop knop-accent knop-breed" href="offerte.html">Offerte aanvragen</a>
                    <button type="button" class="knop knop-outline knop-breed" id="knop-vergelijk" data-vergelijk="${b.id}"></button>
                    <button type="button" class="knop knop-wit knop-breed" id="knop-fav" data-fav="${b.id}"></button>
                  </div>
                  <p class="klein mb-0 mt-2">Offertes aanvragen via Verandawijzer is gratis en vrijblijvend.</p>
                </div>
                <div class="kaart detail-blok">
                  <h2>Waarom via Verandawijzer</h2>
                  <ul class="icoon-lijst">
                    <li>${vinkjeSVG}Vergelijken en offertes aanvragen is 100% gratis.</li>
                    <li>${vinkjeSVG}Bedrijfsgegevens komen van de eigen website van het bedrijf.</li>
                    <li>${vinkjeSVG}Jij kiest wie je benadert — geen ongevraagde telefoontjes.</li>
                  </ul>
                </div>
                <div style="padding:0 6px">
                  <p class="bron-regel mb-0">Gegevens afkomstig van <a href="${b.bron}" target="_blank" rel="noopener">de bedrijfswebsite</a>${b.gecontroleerd ? " · laatst gecontroleerd " + maandJaar(b.gecontroleerd) : ""} · <a href="contact.html">Klopt er iets niet?</a></p>
                  <p class="bron-regel mb-0 mt-1">Ben jij ${b.naam}? <a href="contact.html">Claim of corrigeer deze vermelding</a>.</p>
                </div>
              </aside>
            </div>
          </div>
        </div>`;

      /* Zijbalkknoppen laten meewisselen met vergelijk- en favorietenstatus */
      const knopVergelijk = document.getElementById("knop-vergelijk");
      const knopFav = document.getElementById("knop-fav");
      function zetKnopStatus() {
        const inVergelijk = VF.leesVergelijk().includes(b.id);
        const isFavoriet = VF.leesFavorieten().includes(b.id);
        knopVergelijk.innerHTML = inVergelijk ? `${keurmerkSVG.replace('width="12" height="12"', 'width="16" height="16"')} Verwijder uit vergelijking` : `${plusSVG} Voeg toe aan vergelijking`;
        knopVergelijk.classList.toggle("actief", inVergelijk);
        knopVergelijk.setAttribute("aria-pressed", inVergelijk);
        knopFav.innerHTML = `${hartSVG(isFavoriet)} ${isFavoriet ? "Verwijder uit favorieten" : "Bewaar als favoriet"}`;
        knopFav.classList.toggle("actief", isFavoriet);
        knopFav.setAttribute("aria-pressed", isFavoriet);
      }
      VF.bijVerversen(zetKnopStatus);
      VF.verversUI();
    });
  </script>
</body>
</html>
