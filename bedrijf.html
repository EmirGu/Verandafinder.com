<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bedrijfsprofiel — Verandawijzer.nl</title>
  <meta name="description" content="Bekijk reviews, prijzen, specificaties en werkgebied van dit verandabedrijf. Vergelijk met andere bedrijven en vraag gratis een offerte aan.">
  <meta property="og:title" content="Bedrijfsprofiel — Verandawijzer.nl">
  <meta property="og:description" content="Reviews, prijzen en specificaties van verandabedrijven, onafhankelijk op een rij gezet door Verandawijzer.">
  <meta property="og:type" content="website">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232c5e46'/%3E%3Cpath d='M4 11.5 12 5l8 6.5M6.5 10v9M17.5 10v9M4.5 19h15M10 19v-4h4v4' stroke='%23f0b45c' stroke-width='1.8' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    /* Pagina-specifiek: kleine aanvullingen op het design system */
    .detail-hero .bedrijf-plaats { color: #c9d9cf; font-size: .95rem; margin-top: 2px; }
    .detail-hero .review-aantal { color: #c9d9cf; }
    .keurmerk-rij { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .detail-blok > h2 { font-size: 1.35rem; margin-bottom: 14px; }
    .detail-zijbalk h2 { font-size: 1.05rem; }
    .prijs-regel { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin-bottom: 12px; }
    .prijs-regel .prijs-bedrag { font-family: var(--font-kop); font-weight: 700; font-size: 1.55rem; color: var(--groen-900); }
    .prijs-regel .prijs-eenheid { font-size: .9rem; color: var(--ink-500); font-weight: 500; }
    .review-overzicht {
      display: grid; grid-template-columns: auto 1fr; gap: 14px 44px; align-items: center;
      padding-bottom: 22px; margin-bottom: 6px; border-bottom: 1px solid var(--lijn);
    }
    .review-gem-cijfer { font-family: var(--font-kop); font-weight: 700; font-size: 2.9rem; color: var(--groen-900); line-height: 1.05; }
    .raster-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 22px; }
    .zijbalk-acties { display: grid; gap: 10px; }
    .knop.actief.knop-outline { background: var(--groen-700); color: #fff; }
    .knop.actief.knop-wit { border-color: var(--rood-600); color: var(--rood-600); }
    @media (max-width: 760px) {
      .review-overzicht, .raster-2 { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <a class="skip-link" href="#inhoud">Direct naar inhoud</a>
  <div id="site-header"></div>

  <main id="inhoud">
    <div id="profiel"></div>
  </main>

  <div id="site-footer"></div>

  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const MAANDEN = ["januari", "februari", "maart", "april", "mei", "juni", "juli", "augustus", "september", "oktober", "november", "december"];
      const maandJaar = (datum) => {
        const [jaar, maand] = datum.split("-");
        return MAANDEN[parseInt(maand, 10) - 1] + " " + jaar;
      };
      const komma = (n) => n.toFixed(1).replace(".", ",");
      const vinkjeSVG = '<svg class="vinkje" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
      const keurmerkSVG = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6 9 17l-5-5"/></svg>';
      const sterSVG = '<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor" style="color:var(--amber-500)" aria-hidden="true"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.5 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>';
      const plusSVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>';
      const hartSVG = (gevuld) => `<svg width="16" height="16" viewBox="0 0 24 24" fill="${gevuld ? "currentColor" : "none"}" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1L12 21l7.8-7.6 1-1a5.5 5.5 0 0 0 0-7.8z"/></svg>`;
      const telefoonSVG = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3 19.4 19.4 0 0 1-6-6 19.8 19.8 0 0 1-3-8.7A2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.13.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.27a2 2 0 0 1 2.1-.45c.9.34 1.84.57 2.8.7a2 2 0 0 1 1.7 2z"/></svg>';

      const houder = document.getElementById("profiel");
      const id = new URLSearchParams(location.search).get("id");
      const b = id ? VF.getBedrijf(id) : null;

      /* --- Onbekend of ontbrekend id: nette foutmelding --- */
      if (!b) {
        document.title = "Bedrijf niet gevonden — Verandawijzer.nl";
        houder.innerHTML = `
          <section class="pagina-kop">
            <div class="wrap">
              <nav class="breadcrumb" aria-label="Kruimelpad"><a href="index.html">Home</a> › <a href="bedrijven.html">Bedrijven</a> › <span>Niet gevonden</span></nav>
              <h1>Bedrijf niet gevonden</h1>
            </div>
          </section>
          <section class="sectie">
            <div class="wrap-smal">
              <div class="kaart leeg-melding">
                <div class="leeg-icoon" aria-hidden="true">
                  <svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="var(--ink-300)" stroke-width="1.6" stroke-linecap="round" style="margin:0 auto"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3M8.5 11h5"/></svg>
                </div>
                <h2>Dit bedrijfsprofiel bestaat niet (meer)</h2>
                <p>De link die je volgde klopt niet, of het bedrijf is niet langer aangesloten bij Verandawijzer. Geen zorgen: er zijn genoeg andere verandabouwers om te vergelijken.</p>
                <a class="knop knop-primair" href="bedrijven.html">Bekijk alle bedrijven</a>
              </div>
            </div>
          </section>`;
        return;
      }

      /* --- Bedrijf gevonden: titel en profiel opbouwen --- */
      document.title = b.naam + " — Verandawijzer.nl";

      const werkgebiedTekst = b.werkgebied.includes("Landelijk") ? "Heel Nederland" : b.werkgebied.join(", ");
      const klasseBadge = { budget: "badge-groen", midden: "", premium: "badge-amber" }[b.prijsKlasse] || "";
      const m2 = 15;

      /* Reviews: nieuwste eerst + verdeling per aantal sterren */
      const reviews = [...b.reviews].sort((a, c) => c.datum.localeCompare(a.datum));
      const verdeling = [5, 4, 3, 2, 1].map((s) => ({ ster: s, aantal: b.reviews.filter((r) => r.score === s).length }));
      const verdelingLabel = "Scoreverdeling: " + verdeling.map((v) => `${v.ster} sterren: ${v.aantal} ${v.aantal === 1 ? "review" : "reviews"}`).join(", ");
      const verdelingHTML = verdeling.map((v) => {
        const pct = b.reviews.length ? Math.round((v.aantal / b.reviews.length) * 100) : 0;
        return `<div class="verdeling-rij">
          <span style="display:flex;align-items:center;gap:4px;justify-content:flex-end">${v.ster} ${sterSVG}</span>
          <div class="verdeling-balk"><span style="width:${pct}%"></span></div>
          <span>${v.aantal}</span>
        </div>`;
      }).join("");

      const reviewsHTML = reviews.map((r) => `
        <article class="review-kaart">
          <div class="review-kop">
            <div><span class="review-naam">${r.naam}</span> <span class="review-meta">${r.plaats} · ${maandJaar(r.datum)}</span></div>
            ${VF.sterrenHTML(r.score)}
          </div>
          <h3 style="font-size:1rem;margin:0">${r.titel}</h3>
          <p>${r.tekst}</p>
          <p class="review-project">Project: ${r.project}</p>
        </article>`).join("");

      /* Vergelijkbare bedrijven: zelfde provincie in werkgebied of zelfde prijsklasse, hoogste rating eerst */
      const vergelijkbaar = BEDRIJVEN
        .filter((x) => x.id !== b.id)
        .map((x) => ({
          bedrijf: x,
          score: (x.werkgebied.includes(b.provincie) || x.werkgebied.includes("Landelijk") ? 2 : 0) + (x.prijsKlasse === b.prijsKlasse ? 1 : 0)
        }))
        .filter((x) => x.score > 0)
        .sort((a, c) => c.score - a.score || c.bedrijf.rating - a.bedrijf.rating || c.bedrijf.aantalReviews - a.bedrijf.aantalReviews)
        .slice(0, 2)
        .map((x) => x.bedrijf);

      const specRij = (label, waarde) => `<tr><th scope="row">${label}</th><td>${waarde}</td></tr>`;

      houder.innerHTML = `
        <section class="detail-hero">
          <div class="wrap">
            <nav class="breadcrumb" aria-label="Kruimelpad"><a href="index.html">Home</a> › <a href="bedrijven.html">Bedrijven</a> › <span>${b.naam}</span></nav>
            <div class="detail-kop-raster">
              <div class="detail-logo" style="background:${b.kleur}" aria-hidden="true">${VF.initialen(b.naam)}</div>
              <div>
                <h1>${b.naam}</h1>
                <p class="bedrijf-plaats"><svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a7 7 0 0 0-7 7c0 5 7 13 7 13s7-8 7-13a7 7 0 0 0-7-7zm0 9.5A2.5 2.5 0 1 1 12 6a2.5 2.5 0 0 1 0 5.5z"/></svg>${b.plaats}, ${b.provincie}</p>
                <div class="score-blok mt-1">
                  ${VF.sterrenHTML(b.rating)}
                  <span class="score-cijfer">${komma(b.rating)}</span>
                  <span class="review-aantal">${b.aantalReviews} reviews</span>
                </div>
                ${b.keurmerken.length ? `<div class="keurmerk-rij">${b.keurmerken.map((k) => `<span class="badge badge-keurmerk">${keurmerkSVG}${k}</span>`).join("")}</div>` : ""}
              </div>
            </div>
          </div>
        </section>

        <div class="detail-body">
          <div class="wrap">
            <div class="detail-raster">
              <div class="detail-hoofdkolom">

                <section class="kaart detail-blok" aria-labelledby="kop-over">
                  <h2 id="kop-over">Over ${b.naam}</h2>
                  <p>${b.beschrijving}</p>
                  <ul class="icoon-lijst mt-2">
                    ${b.usps.map((usp) => `<li>${vinkjeSVG}${usp}</li>`).join("")}
                  </ul>
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-specs">
                  <h2 id="kop-specs">Specificaties</h2>
                  <table class="specs-tabel">
                    <tbody>
                      ${specRij("Producten", b.producten.map((p) => PRODUCTEN[p]).join(", "))}
                      ${specRij("Materialen", b.typen.map((t) => MATERIALEN[t]).join(", "))}
                      ${specRij("Daktypen", b.dakTypen.map((d) => DAKTYPEN[d]).join(", "))}
                      ${specRij("Opties", b.opties.map((o) => OPTIES[o]).join(", "))}
                      ${specRij("Werkgebied", werkgebiedTekst)}
                      ${specRij("Opgericht", b.opgericht)}
                      ${specRij("Projecten per jaar", "± " + b.projectenPerJaar.toLocaleString("nl-NL"))}
                      ${specRij("Gemiddelde levertijd", "± " + b.levertijdWeken + " weken")}
                      ${specRij("Garantie", b.garantieJaren + " jaar op de constructie")}
                      ${specRij("Montage door eigen team", b.montageEigenTeam ? "Ja, eigen monteurs" : "Nee, via montagepartners")}
                      ${specRij("Showroom", b.showroom ? "Ja" : "Nee")}
                    </tbody>
                  </table>
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-prijs">
                  <h2 id="kop-prijs">Prijsindicatie</h2>
                  <div class="prijs-regel">
                    <span class="prijs-bedrag">${VF.euro(b.prijsPerM2.min)} – ${VF.euro(b.prijsPerM2.max)}</span>
                    <span class="prijs-eenheid">per m², incl. montage</span>
                    <span class="badge ${klasseBadge}">${PRIJSKLASSEN[b.prijsKlasse]}</span>
                  </div>
                  <p>De uiteindelijke prijs hangt af van de uitvoering: afmeting, materiaal, daktype en opties zoals verlichting, zonwering of schuifwanden bepalen samen het eindbedrag. Zie deze richtprijs dus als een startpunt, niet als een offerte.</p>
                  <h3 style="font-size:1rem">Voorbeeldberekening: veranda van 5×3 meter (${m2} m²)</h3>
                  <table class="specs-tabel">
                    <tbody>
                      ${specRij("Eenvoudige uitvoering", `${m2} m² × ${VF.euro(b.prijsPerM2.min)} = <strong>${VF.euro(m2 * b.prijsPerM2.min)}</strong>`)}
                      ${specRij("Luxe uitvoering", `${m2} m² × ${VF.euro(b.prijsPerM2.max)} = <strong>${VF.euro(m2 * b.prijsPerM2.max)}</strong>`)}
                    </tbody>
                  </table>
                  <p class="mb-0 mt-1"><a href="prijzen.html">Bereken je eigen richtprijs met de prijswijzer →</a></p>
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-reviews">
                  <h2 id="kop-reviews">Reviews</h2>
                  <div class="review-overzicht">
                    <div>
                      <div class="review-gem-cijfer">${komma(b.rating)}</div>
                      ${VF.sterrenHTML(b.rating)}
                      <p class="klein mb-0 mt-1">op basis van ${b.aantalReviews} beoordelingen</p>
                    </div>
                    <div role="img" aria-label="${verdelingLabel}">
                      ${verdelingHTML}
                      <p class="klein mb-0 mt-1">Verdeling van de ${b.reviews.length} recentste reviews hieronder.</p>
                    </div>
                  </div>
                  ${reviewsHTML}
                </section>

                <section class="kaart detail-blok" aria-labelledby="kop-vergelijkbaar">
                  <h2 id="kop-vergelijkbaar">Vergelijkbare bedrijven</h2>
                  <p class="klein">Ook actief in jouw regio of in dezelfde prijsklasse.</p>
                  <div class="raster-2">
                    ${vergelijkbaar.map(VF.bedrijfKaartHTML).join("")}
                  </div>
                </section>

              </div>

              <aside class="detail-zijbalk" aria-label="Acties voor dit bedrijf">
                <div class="kaart detail-blok">
                  <h2>Direct regelen</h2>
                  <div class="zijbalk-acties">
                    <a class="knop knop-accent knop-breed" href="offerte.html">Offerte aanvragen</a>
                    <button type="button" class="knop knop-outline knop-breed" id="knop-vergelijk" data-vergelijk="${b.id}"></button>
                    <button type="button" class="knop knop-wit knop-breed" id="knop-fav" data-fav="${b.id}"></button>
                    <a class="knop knop-ghost knop-breed" href="tel:${b.telefoon.replace(/\D/g, "")}">${telefoonSVG}${b.telefoon}</a>
                  </div>
                  <p class="klein mb-0 mt-2">Gratis en vrijblijvend · reactie meestal binnen één werkdag.</p>
                </div>
                <div class="kaart detail-blok">
                  <h2>Waarom via Verandawijzer</h2>
                  <ul class="icoon-lijst">
                    <li>${vinkjeSVG}Vergelijken en offertes aanvragen is 100% gratis.</li>
                    <li>${vinkjeSVG}Reviews komen van echte klanten en worden gecontroleerd.</li>
                    <li>${vinkjeSVG}Jij kiest wie je benadert — geen ongevraagde telefoontjes.</li>
                  </ul>
                </div>
              </aside>
            </div>
          </div>
        </div>`;

      /* Zijbalkknoppen laten meewisselen met vergelijk- en favorietenstatus */
      const knopVergelijk = document.getElementById("knop-vergelijk");
      const knopFav = document.getElementById("knop-fav");
      function zetKnopStatus() {
        const inVergelijk = VF.leesVergelijk().includes(b.id);
        const isFavoriet = VF.leesFavorieten().includes(b.id);
        knopVergelijk.innerHTML = inVergelijk ? `${keurmerkSVG.replace('width="12" height="12"', 'width="16" height="16"')} Verwijder uit vergelijking` : `${plusSVG} Voeg toe aan vergelijking`;
        knopVergelijk.classList.toggle("actief", inVergelijk);
        knopVergelijk.setAttribute("aria-pressed", inVergelijk);
        knopFav.innerHTML = `${hartSVG(isFavoriet)} ${isFavoriet ? "Verwijder uit favorieten" : "Bewaar als favoriet"}`;
        knopFav.classList.toggle("actief", isFavoriet);
        knopFav.setAttribute("aria-pressed", isFavoriet);
      }
      VF.bijVerversen(zetKnopStatus);
      VF.verversUI();
    });
  </script>
</body>
</html>
